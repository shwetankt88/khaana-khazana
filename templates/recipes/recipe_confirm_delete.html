{% extends 'base.html' %}
{% block title %}Delete Recipe - Khaana Khazana{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Delete Recipe</h2>
    <p>Are you sure you want to delete "{{ recipe.title }}"?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{{ recipe.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
